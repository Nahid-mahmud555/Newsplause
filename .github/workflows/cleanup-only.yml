name: Database Cleanup

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:

jobs:
  cleanup:
    name: Cleanup Old Records
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Dependencies
        working-directory: ./backend
        run: |
          npm init -y
          npm install @supabase/supabase-js dotenv
      
      - name: Create .env
        working-directory: ./backend
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
      
      - name: Run Cleanup Script
        working-directory: ./backend
        run: |
          node -e "
          import { createClient } from '@supabase/supabase-js';
          import dotenv from 'dotenv';
          dotenv.config();
          
          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY);
          
          // Delete old news
          const date = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
          const { error: e1 } = await supabase.from('news_feed').delete().neq('category','jobs').lt('created_at',date);
          console.log('24h cleanup:', e1 ? 'Failed' : 'Done');
          
          // Delete expired jobs
          const today = new Date().toISOString().split('T')[0];
          const { error: e2 } = await supabase.from('news_feed').delete().eq('category','jobs').lt('deadline',today);
          console.log('Jobs cleanup:', e2 ? 'Failed' : 'Done');
          "
